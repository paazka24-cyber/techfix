name: techfix
description: Device Repair & Technician Booking Platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  google_sign_in: ^6.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0
  image_picker: ^1.2.4
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  equatable: ^2.0.5
  http: ^1.6.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
